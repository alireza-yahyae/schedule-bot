<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="Vazirmatn, 'Segoe UI', Tahoma, Arial, sans-serif">
  <rect width="1100" height="300" rx="20" fill="#F8FAFF" stroke="#DCE5FF"/>
  <text x="550" y="42" font-size="24" font-weight="800" fill="#1F2937" text-anchor="middle">One class, from reminder to result</text>
  <line x1="90" y1="150" x2="1010" y2="150" stroke="#C7D2FE" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="150" r="22" fill="#4F8CFF"/><text x="110" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-15</text><text x="110" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Reminder</text><text x="110" y="226" font-size="13" fill="#6B7280" text-anchor="middle">15 min before</text>
  <circle cx="290" cy="150" r="22" fill="#4F8CFF"/><text x="290" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-10</text><text x="290" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Reminder</text><text x="290" y="226" font-size="13" fill="#6B7280" text-anchor="middle">10 min before</text>
  <circle cx="500" cy="150" r="22" fill="#10B981"/><text x="500" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">0</text><text x="500" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Class time</text><text x="500" y="226" font-size="13" fill="#6B7280" text-anchor="middle">buttons appear</text>
  <circle cx="690" cy="150" r="22" fill="#F59E0B"/><text x="690" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">+5</text><text x="690" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Nag</text><text x="690" y="226" font-size="13" fill="#6B7280" text-anchor="middle">every 5 minutes</text>
  <circle cx="860" cy="150" r="22" fill="#F59E0B"/><text x="860" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">+10</text><text x="860" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Nag</text><text x="860" y="226" font-size="13" fill="#6B7280" text-anchor="middle">until you answer</text>
  <circle cx="1000" cy="150" r="22" fill="#8B5CF6"/><text x="1000" y="156" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">end</text><text x="1000" y="206" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Result</text><text x="1000" y="226" font-size="13" fill="#6B7280" text-anchor="middle">went / skipped / none</text>
  <text x="550" y="270" font-size="14" fill="#6B7280" text-anchor="middle">Times, nag interval and offsets are yours to change in the Mini App. Quiet days and pause mode silence everything.</text>
</svg>