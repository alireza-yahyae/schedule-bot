  </g>
  <g transform="translate(900,210)">
    <rect width="300" height="44" rx="18" fill="url(#card)" stroke="#fff" stroke-opacity=".35"/>
    <text x="20" y="28" font-size="16" fill="#fff">🔥 5-day streak · 3h 20m studied today</text>
