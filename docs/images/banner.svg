<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" font-family="Vazirmatn, 'Segoe UI', Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B6FE0"/><stop offset="1" stop-color="#7C4DDB"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="170" fill="#fff" opacity=".07"/>
  <circle cx="1210" cy="320" r="120" fill="#fff" opacity=".06"/>
  <circle cx="90" cy="330" r="110" fill="#fff" opacity=".05"/>
  <!-- logo -->
  <g transform="translate(72,86)">
    <rect width="96" height="96" rx="22" fill="#fff"/>
    <rect x="20" y="26" width="56" height="50" rx="9" fill="#E8EEFF"/>
    <rect x="31" y="18" width="6" height="15" rx="3" fill="#4F8CFF"/><rect x="59" y="18" width="6" height="15" rx="3" fill="#4F8CFF"/>
    <circle cx="48" cy="56" r="13" fill="none" stroke="#4F8CFF" stroke-width="4"/>
    <path d="M48 48v9l6 4" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="196" y="138" font-size="62" font-weight="800" fill="#fff">Schedule Bot</text>
  <text x="198" y="186" font-size="26" fill="#EAF0FF">Class reminders, habits and a Mini App for Telegram</text>
  <text x="198" y="226" font-size="20" fill="#CFD9FF">Runs 24/7 on Cloudflare Workers · free plan is enough · set up with one PowerShell command</text>
  <text x="1208" y="300" font-size="26" fill="#EAF0FF" text-anchor="end" direction="rtl" unicode-bidi="plaintext">ربات برنامه‌ی هفتگی و یادآوری کلاس برای تلگرام</text>
  <!-- chat bubbles -->
  <g transform="translate(900,70)">
    <rect width="300" height="64" rx="18" fill="url(#card)" stroke="#fff" stroke-opacity=".35"/>
    <text x="20" y="28" font-size="17" fill="#fff" font-weight="700">⏰ Thermodynamics 2</text>
    <text x="20" y="50" font-size="15" fill="#E3EAFF">starts in 15 minutes · Room 204</text>
  </g>
  <g transform="translate(940,150)">
    <rect width="260" height="44" rx="18" fill="url(#card)" stroke="#fff" stroke-opacity=".35"/>
